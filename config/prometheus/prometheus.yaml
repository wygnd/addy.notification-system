# Prometheus — конфигурация сбора метрик стека ADDY notification-system.
# Монтируется в ns-prometheus как /etc/prometheus/prometheus-config.yaml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ ]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]

  # Pushgateway — принимает метрики от batch-скриптов / jobs
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [ 'pushgateway:9091' ]

  # Loki — встроенный /metrics
  - job_name: loki
    static_configs:
      - targets: [ 'loki:3100' ]

  # Promtail — встроенный /metrics
  - job_name: promtail
    static_configs:
      - targets: [ 'promtail:9080' ]

  # Grafana — встроенный /metrics
  - job_name: grafana
    static_configs:
      - targets: [ 'grafana:3000' ]

  # Node-сервисы стека.
