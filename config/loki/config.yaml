server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9095

auth_enabled: false

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  wal:
    dir: /loki/wal

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-shipper-active
    cache_location: /loki/tsdb-shipper-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/tsdb-shipper-compactor
  retention_enabled: true
  retention_delete_period: 24h

limits_config:
  reject_old_samples: false
  retention_period: 168h  # 7 дней; уберите строку, чтобы хранить вечно
  # Сколько здоровых ингестеров в ring нужно для записи/чтения.
  # Single-node (1 реплика, ring inmemory) => строго 1.
  # Значение 2 даёт ошибку "need 2 ingesters, found 1".
  replication_factor: 1

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true