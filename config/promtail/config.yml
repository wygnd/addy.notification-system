server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Храним в volume, чтобы после рестарта не перечитывать логи с нуля
  filename: /var/promtail/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: containers

    static_configs:
      - targets:
          - localhost
        labels:
          job: containers_logs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag

      # Формат tag от Docker: full_image:tag|container_name|image_id|container_id
      - regex:
          expression: (?P<image_name>(?:[^|]*[^|]))\|(?P<container_name>(?:[^|]*[^|]))\|(?P<image_id>(?:[^|]*[^|]))\|(?P<container_id>(?:[^|]*[^|]))
          source: "tag"

      - labels:
          tag:
          stream:
          image_name:
          container_name:
          image_id:
          container_id: