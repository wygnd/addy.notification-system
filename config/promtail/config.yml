server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ---------------------------------------------------------------------------
  # Системные логи хоста (только верхний уровень /var/log/*.log).
  # ---------------------------------------------------------------------------
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # ---------------------------------------------------------------------------
  # Nginx на хосте: access.log + error.log.
  # Стандартный access.log — обычный текст (combined), парсинг не включён.
  # ---------------------------------------------------------------------------
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*log

  # ---------------------------------------------------------------------------
  # Все Docker-контейнеры через docker service discovery.
  # ---------------------------------------------------------------------------
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: status
            values: [ "running" ]

    relabel_configs:
      - source_labels: [ "__meta_docker_container_name" ]
        regex: "/ns-.*"
        target_label: container_name

      - source_labels: [ "__meta_docker_container_name" ]
        regex: "ns-gateway"
        target_label: job
        replacement: "api-gateway"
      - source_labels: [ "__meta_docker_container_name" ]
        regex: "ns-identity"
        target_label: job
        replacement: "identity-service"
      - source_labels: [ "__meta_docker_container_name" ]
        regex: "ns-telegram"
        target_label: job
        replacement: "telegram-service"
      - source_labels: [ "__meta_docker_container_name" ]
        regex: "ns-vk"
        target_label: job
        replacement: "vk-service"

    pipeline_stages:
      # Для node-сервисов разбираем pino-JSON и поднимаем полезные (низко-
      # кардинальные) лейблы. Инфра-контейнеры (plain text) не трогаем.
      - match:
          # Stream-селектор (LogQL) по лейблу container_name, который ставит relabel выше
          selector: '{container_name=~"ns-(gateway|identity|telegram|vk|max)"}'
          stages:
            - json:
                expressions:
                  level: label
                  environment: environment
                  type: type
                  method: method
                  path: path
                  status_code: status_code
                  message: message
                  req_url: req.url
            - labels:
                level:
                status_code:
                service:
                environment:
