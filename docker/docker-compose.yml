services:

  # NODE SERVICES
  gateway:
    build:
      context: ../
      dockerfile: apps/api-gateway/Dockerfile
    container_name: ns-gateway
    env_file:
      - ../apps/api-gateway/.env
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT}:3000"
    restart: always
    networks:
      - public
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/api/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3

  identity-service:
    build:
      context: ../
      dockerfile: apps/identity-service/Dockerfile
    container_name: ns-identity
    env_file:
      - ../apps/identity-service/.env
    restart: always
    networks:
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-service:
    build:
      context: ../
      dockerfile: apps/telegram-service/Dockerfile
    container_name: ns-telegram
    env_file:
      - ../apps/telegram-service/.env
    restart: always
    networks:
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  vk-service:
    build:
      context: ../
      dockerfile: apps/vk-service/Dockerfile
    container_name: ns-vk
    env_file:
      - ../apps/vk-service/.env
    restart: always
    networks:
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OTHER CONTAINERS
  postgres:
    image: postgres:18-alpine
    container_name: ns-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    networks:
      - private
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: ns-rabbitmq
    restart: always
    networks:
      - private
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    container_name: ns-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:

networks:
  private:
    driver: bridge
    internal: true
  public:
    driver: bridge