services:

  # NODE SERVICES
  gateway:
    build:
      context: ../
      dockerfile: apps/api-gateway/Dockerfile
    container_name: ns-gateway
    environment:
      - NODE_ENV=production
    env_file:
      - ../apps/api-gateway/.env
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT}:3000"
    restart: always
    networks:
      - public
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/api/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3

  identity-service:
    build:
      context: ../
      dockerfile: apps/identity-service/Dockerfile
    container_name: ns-identity
    env_file:
      - ../apps/identity-service/.env
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - private
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-service:
    build:
      context: ../
      dockerfile: apps/telegram-service/Dockerfile
    container_name: ns-telegram
    env_file:
      - ../apps/telegram-service/.env
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - private
      - public
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  vk-service:
    build:
      context: ../
      dockerfile: apps/vk-service/Dockerfile
    container_name: ns-vk
    env_file:
      - ../apps/vk-service/.env
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - private
      - public
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OTHER CONTAINERS
  postgres:
    image: postgres:18-alpine
    container_name: ns-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    networks:
      - private
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: ns-rabbitmq
    restart: always
    networks:
      - private
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8
    container_name: ns-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: "grafana/grafana-oss:10.2.2"
    container_name: ns-grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - public
      - private
      - monitoring
    depends_on:
      - prometheus
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 1024M

  prometheus:
    image: "prom/prometheus:v2.48.0"
    container_name: ns-prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT}:9090'
    volumes:
      - ../config/prometheus/prometheus.yaml:/etc/prometheus/prometheus-config.yaml:ro
      - ../config/prometheus/web-config.yaml:/etc/prometheus/web-config.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - private
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus-config.yaml"
      - "--web.config.file=/etc/prometheus/web-config.yaml"
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 1024M

  pushgateway:
    image: "prom/pushgateway:v1.6.2"
    ports:
      - 9091:9091
    networks:
      - private
      - monitoring
    volumes:
      - ../config/prometheus/web-config.yaml:/etc/prometheus/web-config.yaml:ro
    command:
      - "--web.config.file=/etc/prometheus/web-config.yaml"
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M

  loki:
    image: "grafana/loki:2.9.0"
    container_name: ns-loki
    volumes:
      - ../config/loki/config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - private
      - monitoring
    command:
      - "--config.file=/etc/loki/loki-config.yaml"
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 1024M

  promtail:
    image: "grafana/promtail:2.9.0"
    container_name: ns-promtail
    volumes:
      - ../config/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/var/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    environment:
      HOST_HOSTNAME: "{{.Node.Hostname}}"
    networks:
      - private
      - monitoring
    command:
      - "--config.file=/etc/promtail/config.yml"
      - "--config.expand-env=true"
    deploy:
      mode: global
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 512M

  sub2socks:
    image: sub2socks:latest
    container_name: ns-sub2socks
    ports:
      - "${SUB2SOCKS_PORT}:1080"
    networks:
      - private
      - public
    environment:
      SUB_URL: "${SUB2SOCKS_SUB_URL}"
      DNS_SERVER: "${SUB2SOCKS_DNS_SERVER}"

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data:
  promtail_data:

networks:
  private:
    driver: bridge
    internal: true
  public:
    driver: bridge
  monitoring:
    driver: bridge